<svg xmlns="http://www.w3.org/2000/svg" width="800" height="28" viewBox="0 0 800 28" fill="none" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#00BFFF" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#00BFFF" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#00BFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00BFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>

  <!-- baseline with a slow, soft brightness drift -->
  <rect x="0" y="13" width="800" height="2" rx="1" fill="url(#fade)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- small current spike travelling along the line, then resting -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-40 0;840 0;840 0" keyTimes="0;0.55;1" dur="7s" repeatCount="indefinite"/>
    <path d="M0 14 H10 L13 8 L16 20 L19 14 H32" stroke="#00BFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.7"/>
    <path d="M0 14 H10 L13 8 L16 20 L19 14 H32" stroke="#E6F9FF" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- soft glitter -->
  <g fill="#BFF1FF">
    <circle cx="90"  cy="14" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="0s"   repeatCount="indefinite"/></circle>
    <circle cx="190" cy="12" r="1"  ><animate attributeName="opacity" values="0;1;0" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="16" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="3.6s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="13" r="1.4"><animate attributeName="opacity" values="0;1;0" dur="4.4s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="15" r="1"  ><animate attributeName="opacity" values="0;1;0" dur="3.4s" begin="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="12" r="1.2"><animate attributeName="opacity" values="0;1;0" dur="4.8s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="14" r="1.3"><animate attributeName="opacity" values="0;1;0" dur="3.9s" begin="0.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
